[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satrx"
version = "0.1.0"
description = "Automated satellite signal receiver with web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "skyfield>=1.48",
    "numpy>=1.26",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "scipy>=1.11",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rtlsdr = ["pyrtlsdr[lib]>=0.3; sys_platform == 'win32'", "pyrtlsdr>=0.3; sys_platform != 'win32'"]
soak = ["psutil>=5.9"]

[project.scripts]
satrx = "satrx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satrx = ["migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
